server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* from the reverse proxy so rate limits see the real client IP.
  forward-headers-strategy: framework

spring:
  application:
    name: foodos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/food_os_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:database@1}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is created/updated automatically. For a stricter production setup,
      # switch to "validate" and manage the schema with Flyway or Liquibase.
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

foodos:
  # Comma separated list of allowed browser origins (the React app).
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    # Must be at least 32 characters. Override in every real deployment.
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
    admin-email: ${ADMIN_EMAIL:admin@foodos.in}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    from: ${NOTIFY_FROM:no-reply@foodos.in}
    sales-team-to: ${NOTIFY_TO:hello@foodos.in}
  pricing:
    foodos-monthly-fee: 999
    # Share of "other software" spend that FoodOS replaces (WhatsApp tool, inventory app, etc.).
    other-software-offset-percent: 50

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # An SMTP outage must not mark the whole service as DOWN.
    mail:
      enabled: false